<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bean Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f4ece4;">

<header class="navbar">
    <div class="nav-container">
        <div class="brand"><h1>Bean<span>Haven</span></h1></div>
        <nav><ul class="nav-links"><li><a href="index.html" class="nav-link">Return to Menu</a></li></ul></nav>
    </div>
</header>

<main class="checkout-main">
    <h2 class="section-title">Complete Your Order</h2>
    
    <div id="cart-summary" style="margin-bottom: 30px;">

    </div>

    <div class="total-section">
        Total: <span id="grand-total">₱0</span>
    </div>

    <div class="contact-form" style="padding: 0;">
        <h3 style="margin-bottom: 20px;">Payment Information</h3>
        <form id="payment-form">
            <input type="text" placeholder="Cardholder Name" required>
            <input type="text" placeholder="Card Number (0000 0000 0000 0000)" required>
            <div class="input-row">
                <input type="text" placeholder="MM/YY" required>
                <input type="text" placeholder="CVV" required>
            </div>
            <button type="submit" class="submit-btn">Pay Now</button>
        </form>
    </div>
</main>

<script>
    const cart = JSON.parse(localStorage.getItem('coffee_cart')) || [];
    const summaryDiv = document.getElementById('cart-summary');
    const totalSpan = document.getElementById('grand-total');
    let total = 0;

    if (cart.length === 0) {
        summaryDiv.innerHTML = "<p>Your cart is empty.</p>";
    } else {
        cart.forEach(item => {
            total += item.price;
            summaryDiv.innerHTML += `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <span>₱${item.price}</span>
                </div>
            `;
        });
    }

    totalSpan.innerText = `₱${total}`;

    document.getElementById('payment-form').onsubmit = (e) => {
        e.preventDefault();
        alert("Payment successful! Your handcrafted coffee is being prepared.");
        localStorage.removeItem('coffee_cart');
        window.location.href = "index.html";
    };
</script>

</body>
</html>
